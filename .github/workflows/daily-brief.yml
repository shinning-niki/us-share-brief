name: 美股收盘简报

# ===========================================================================
# 调度设计：为什么是「提前排队 + 睡到收盘」，而不是简单的多个定时点
# ===========================================================================
# 事实基础（本仓库 + trend-dashboard + a-share-brief 的完整调度历史）：
#   GitHub Actions 原生 cron 是 best-effort，实测延迟 0.5 ~ 5.5 小时，
#   偶尔直接丢弃不跑，且失败完全静默。没有任何 UTC 时段是可靠的：
#     trend-dashboard 的 cron 设在 UTC 11-15 五个整点，
#     实际执行时刻却散布在 UTC 15:23 ~ 20:33 之间。
#
# 原来的设计把 cron 设在收盘后（北京 07:40），距离「早上 8 点送达」只有
# 20 分钟余量。一旦延迟 2 小时就彻底错过。cron 越靠近送达时限，容错越小。
#
# 现在的设计把 cron 设在收盘前（北京 23:45 / 00:45），job 一起来就先睡到
# 美股收盘（美东 16:05）。这样「队列延迟」和「睡眠」互相抵消：
#
#   北京 23:45 准点起跑   -> 睡 4h20m（夏令时）/ 5h20m（冬令时）-> 04:05 干活
#   北京 23:45 延迟 3 小时 -> 02:45 起跑 -> 睡 1h20m -> 04:05 干活
#   北京 23:45 延迟 5 小时 -> 04:45 起跑 -> 已收盘不睡 -> 04:45 干活
#
# 也就是说：只要 job 在收盘后 3 小时内被调度起来，送达时间都是「收盘后
# 几分钟」。容错空间从 20 分钟扩大到 5 小时。
#
# 仓库是 public，Actions 分钟数完全免费不限量，睡 5 小时不产生费用。
#
# ---------------------------------------------------------------------------
# 触发点清单（13 个，分三层）
# ---------------------------------------------------------------------------
#   层    UTC cron            北京时刻            作用
#   ----  ------------------  ------------------  --------------------------
#   锚点  45 15 * * 1-5       23:45 周一~周五     主锚点，睡到收盘
#   锚点  45 16 * * 1-5       00:45 周二~周六     备锚点，睡到收盘
#   尾点  10 20 * * 1-5       04:10 周二~周六     收盘后直接干
#   尾点  50 20 * * 1-5       04:50
#   尾点  30 21 * * 1-5       05:30
#   尾点  10 22 * * 1-5       06:10
#   尾点  50 22 * * 1-5       06:50
#   尾点  30 23 * * 1-5       07:30
#   尾点  15  0 * * 2-6       08:15
#   尾点  50  0 * * 2-6       08:50
#   尾点  25  1 * * 2-6       09:25
#   兜底  0   4 * * 2-6       12:00               早上全挂时中午补发
#   兜底  0  10 * * 2-6       18:00               最后一道，绝不静默
#
# 星期写法必须分两段：UTC 15:45 / 20:10 / 23:30 落在 UTC 周一至周五
# （对应北京周二至周六的早上），而 UTC 00:15 之后跨了零点是 UTC 周二至周六。
# 两段合起来正好覆盖美东周一至周五的每个交易日。
#
# 去重靠 data/sent.json 的「当日已完成」闸门：第一个跑成功的写标记，
# 后面的看到标记直接退出（约 10 秒），绝不重复推送。
# ===========================================================================

on:
  schedule:
    # --- 锚点：收盘前起跑，job 内睡到美东 16:05 ---
    - cron: '45 15 * * 1-5'
    - cron: '45 16 * * 1-5'
    # --- 尾点：收盘后直接执行 ---
    - cron: '10 20 * * 1-5'
    - cron: '50 20 * * 1-5'
    - cron: '30 21 * * 1-5'
    - cron: '10 22 * * 1-5'
    - cron: '50 22 * * 1-5'
    - cron: '30 23 * * 1-5'
    - cron: '15 0 * * 2-6'
    - cron: '50 0 * * 2-6'
    - cron: '25 1 * * 2-6'
    # --- 兜底：早上全挂时补发，保证绝不静默 ---
    - cron: '0 4 * * 2-6'
    - cron: '0 10 * * 2-6'
  workflow_dispatch:
    inputs:
      force:
        description: '强制重跑（忽略当日已完成判断）'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # 串行执行，避免两个 run 同时写 sent.json 打架。
  # 锚点在睡眠期间占锁，后面的触发点排队；锚点结束后第一个 pending 立即执行
  # 并通过闸门跳过——不会重复推送，也不会漏掉重试机会。
  group: us-share-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    # 锚点最长睡 5h20m（冬令时），加上抓数与部署约 5 分钟。
    # GitHub 单 job 硬上限 6 小时，这里留出余量。
    timeout-minutes: 350
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TZ: Asia/Shanghai
      PAGE_URL: ${{ vars.PAGE_URL || 'https://shinning-niki.github.io/us-share-brief/' }}

    steps:
      # fetch-depth: 0 + 显式 ref：睡眠期间别的 run 可能推送过 commit，
      # 醒来后要 git pull --rebase 对齐。detached HEAD 下 pull 会直接报错，
      # 所以这里固定在 main 分支上。
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ------------------------------------------------------------ 第一道闸门
      # 放在睡眠之前：如果今天已经推送过（比如手动补跑），立刻退出，
      # 不浪费 5 小时睡眠额度。
      - name: 去重闸门（当日是否已完成）
        id: gate
        env:
          FORCE_INPUT: ${{ github.event.inputs.force }}
        run: |
          ARG=""
          if [ "$FORCE_INPUT" = "true" ]; then
            ARG="--force"
          fi
          OUT=$(python scripts/check_done.py $ARG)
          echo "$OUT"
          SKIP=$(echo "$OUT" | grep '^skip=' | cut -d= -f2)
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
          if [ "$SKIP" = "true" ]; then
            echo "::notice title=已推送::今日简报已完成，本次触发跳过"
          else
            echo "::notice title=执行::今日尚未完成，继续"
          fi

      # ------------------------------------------------------------ 吸收队列延迟
      # 整套方案的核心：如果现在还没到美东 16:05，就睡到那时候再干活。
      # cron 的队列延迟被睡眠吃掉，送达时间恒定在收盘后几分钟。
      - name: 等待美股收盘（吸收 cron 延迟）
        id: wait
        if: steps.gate.outputs.skip != 'true'
        run: python scripts/wait_for_close.py

      # ------------------------------------------------------------ 第二道闸门
      # 睡眠期间可能已有其他 run 跑完并推送，醒来必须复查一次，
      # 否则会重复推送。
      - name: 醒来复查闸门
        id: gate2
        if: steps.gate.outputs.skip != 'true' && steps.wait.outputs.reason != 'too-early'
        env:
          FORCE_INPUT: ${{ github.event.inputs.force }}
        run: |
          # force 必须同时作用于两道闸门。只作用于第一道时，睡眠醒来会被
          # 第二道以「今日已完成」拦下，手动强制重跑会永久失效。
          ARG=""
          if [ "$FORCE_INPUT" = "true" ]; then
            ARG="--force"
          fi
          OUT=$(python scripts/check_done.py $ARG)
          echo "$OUT"
          SKIP=$(echo "$OUT" | grep '^skip=' | cut -d= -f2)
          echo "skip2=$SKIP" >> "$GITHUB_OUTPUT"
          if [ "$SKIP" = "true" ]; then
            echo "::notice title=已被其他触发点完成::本次跳过，不重复推送"
          fi

      # 睡眠期间代码可能被别的 run 更新过，重新对齐，避免推送时被拒
      - name: 同步最新代码
        if: steps.gate.outputs.skip != 'true' && steps.wait.outputs.reason != 'too-early' && steps.gate2.outputs.skip2 != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main || echo "::warning::代码同步失败，继续执行"

      # ------------------------------------------------------------ 取数与渲染
      # 行情接口全挂时 fetch_brief.py 会抛错，而不是把故障伪装成「休市」。
      # 抛错 → run 变红 → 触发告警 → 下一个触发点自动重试。
      - name: 抓取收盘数据
        id: fetch
        if: steps.gate.outputs.skip != 'true' && steps.wait.outputs.reason != 'too-early' && steps.gate2.outputs.skip2 != 'true'
        run: |
          python scripts/fetch_brief.py
          TRADING=$(python -c "import json;print(json.load(open('data/brief.json'))['is_trading_day'])")
          echo "trading=$TRADING" >> $GITHUB_OUTPUT
          echo "交易日: $TRADING"
          if [ "$TRADING" = "False" ]; then
            echo "::notice title=休市::美东当日非交易日，跳过部署与推送"
          fi

      - name: 生成手机版页面
        if: steps.fetch.outputs.trading == 'True'
        run: python scripts/build_brief.py

      - name: 回写成交额历史
        if: steps.fetch.outputs.trading == 'True'
        run: |
          git add data/history.json
          git diff --quiet --cached || git commit -m "chore: 更新成交额历史 $(date +%Y-%m-%d) [skip ci]"
          git pull --rebase --autostash origin main || echo "::warning::同步失败"
          git push || echo "::warning::历史文件推送失败，不影响本次简报"

      # ------------------------------------------------------------ 发布页面
      # Pages 是次要目标：三步全部 continue-on-error，任何一步失败都不许
      # 阻塞手机推送。页面挂了只影响链接内容，不影响送达。
      - name: 配置 Pages
        id: pages_cfg
        if: steps.fetch.outputs.trading == 'True'
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: 上传页面
        id: pages_up
        if: steps.fetch.outputs.trading == 'True'
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: 部署到 GitHub Pages
        id: deploy
        if: steps.fetch.outputs.trading == 'True'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      # ------------------------------------------------------------ 主目标：送达
      - name: 推送到手机
        id: notify
        if: steps.fetch.outputs.trading == 'True'
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          BARK_URL: ${{ secrets.BARK_URL }}
          SCT_KEY: ${{ secrets.SCT_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python scripts/notify.py

      # 只有推送成功才会走到这里。标记写入 sent.json 并提交，后续触发点
      # 据此跳过；若本步之前任何环节失败，标记不落库，下个触发点自动重试。
      - name: 标记本日已完成
        id: mark
        if: steps.fetch.outputs.trading == 'True'
        run: |
          python scripts/mark_done.py
          git add data/sent.json
          git diff --quiet --cached || git commit -m "chore: 标记已推送 $(date +%Y-%m-%d) [skip ci]"
          git pull --rebase --autostash origin main || echo "::warning::同步失败"
          git push || echo "::warning::标记推送失败，下个触发点可能重复推送"

      # ------------------------------------------------------------ 异常告警
      # job 失败时 GitHub 只在网页上标红，不会主动告诉任何人。这一步负责
      # 把「你发现今天没收到」变成「它主动说今天失败了」。
      - name: 失败告警
        if: failure()
        env:
          BARK_URL: ${{ secrets.BARK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          STEP="未知环节"
          if [ "${{ steps.fetch.outcome }}" = "failure" ]; then STEP="抓取收盘数据"; fi
          if [ "${{ steps.notify.outcome }}" = "failure" ]; then STEP="推送到手机"; fi
          if [ "${{ steps.mark.outcome }}" = "failure" ]; then STEP="标记本日已完成"; fi
          python scripts/alert.py \
            "美股简报执行失败" \
            "失败环节：$STEP｜触发：${{ github.event_name }}｜下一个触发点会自动重试"

      - name: 运行摘要
        if: always()
        run: |
          echo "## 美股收盘简报运行记录" >> $GITHUB_STEP_SUMMARY
          echo "| 项目 | 结果 |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| 触发方式 | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 第一道闸门 | skip=${{ steps.gate.outputs.skip }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 收盘等待 | reason=${{ steps.wait.outputs.reason }}｜睡了 ${{ steps.wait.outputs.waited }} 秒 |" >> $GITHUB_STEP_SUMMARY
          echo "| 复查闸门 | skip=${{ steps.gate2.outputs.skip2 }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 交易日 | ${{ steps.fetch.outputs.trading }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 页面部署 | ${{ steps.deploy.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 手机推送 | ${{ steps.notify.outcome }} |" >> $GITHUB_STEP_SUMMARY
          if [ -f data/summary.md ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            cat data/summary.md >> $GITHUB_STEP_SUMMARY
          fi
